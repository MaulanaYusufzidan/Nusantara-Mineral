<svg viewBox="0 0 900 1100" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4f3a" />
      <stop offset="60%" stop-color="#2a3729" />
      <stop offset="100%" stop-color="#1c1a16" />
    </linearGradient>
  </defs>
  <rect width="900" height="1100" fill="url(#sSky)" />

  <!-- canopy: layered leaf-like blobs -->
  <g fill="#2a3729" opacity="0.9">
    <ellipse cx="220" cy="360" rx="180" ry="120" />
    <ellipse cx="470" cy="300" rx="220" ry="150" />
    <ellipse cx="700" cy="380" rx="170" ry="110" />
  </g>
  <g fill="#3d4f3a" opacity="0.85">
    <ellipse cx="300" cy="420" rx="200" ry="130" />
    <ellipse cx="600" cy="440" rx="230" ry="140" />
  </g>
  <g fill="#a9813e" opacity="0.25">
    <ellipse cx="450" cy="380" rx="260" ry="150" />
  </g>

  <!-- ground line: reclaimed terrain -->
  <path
    d="M0,780 L150,760 L300,790 L470,750 L640,785 L900,760 L900,1100 L0,1100 Z"
    fill="#141310"
  />
  <g stroke="#a9813e" stroke-width="3" opacity="0.5">
    <line x1="150" y1="760" x2="150" y2="700" />
    <line x1="470" y1="750" x2="470" y2="690" />
    <line x1="700" y1="768" x2="700" y2="705" />
  </g>
</svg>
